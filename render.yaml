services:
  - type: web
    name: howgo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # 回调地址默认自动跟随访问域名（x-forwarded-host），多域名同时可用；
      # 如需强制固定（例如只在主域提供登录），再解注释并填完整地址
      # - key: HOWGO_PUBLIC_URL
      #   value: https://howgo.laswi.com.cn
      - key: HOWGO_ADMIN_KEY
        generateValue: true
      # 固定管理员密码：容器无持久盘，不固定则重启后无法复现
      - key: HOWGO_ADMIN_PASSWORD
        generateValue: true
      # 云端数据（Supabase 项目 URL 形如 https://xxxx.supabase.co，以及 service_role key）
      - key: HOWGO_STORE_URL
        sync: false
      - key: HOWGO_STORE_KEY
        sync: false
      - key: LASWI_LOGIN_BASE
        value: https://apilogin.rtstudio.top
      - key: LASWI_API_BASE
        value: https://appapi.rtstudio.top
      # name=未验证软件（应用标识写死为 LaswI ID）；token/loginkey=已验证软件，需填 64 位软件 Token
      - key: LASWI_APP_TYPE
        value: name
      # 仅 token / loginkey 模式需要
      - key: LASWI_SOFTWARE_TOKEN
        sync: false
