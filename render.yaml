services:
  - type: web
    name: howgo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOWGO_PUBLIC_URL
        value: https://howgo.laswi.com.cn
      - key: HOWGO_ADMIN_KEY
        generateValue: true
      # 固定管理员密码：容器无持久盘，不固定则重启后无法复现
      - key: HOWGO_ADMIN_PASSWORD
        generateValue: true
      # 云端数据（Supabase 项目 URL 形如 https://xxxx.supabase.co，以及 service_role key）
      - key: HOWGO_STORE_URL
        sync: false
      - key: HOWGO_STORE_KEY
        sync: false
      - key: LASWI_LOGIN_BASE
        value: https://apilogin.rtstudio.top
      - key: LASWI_API_BASE
        value: https://appapi.rtstudio.top
      # name=未验证软件直接用软件名；token=已验证软件填 64 位软件 Token；loginkey=软件 Token 换临时 Key（推荐）
      - key: LASWI_APP_TYPE
        value: name
      - key: LASWI_APP_ID
        value: HowGo
      # 仅 loginkey 模式需要：在 Render 控制台填软件 Token，并把 LASWI_APP_TYPE 改为 loginkey
      - key: LASWI_SOFTWARE_TOKEN
        sync: false
