services:
  - type: web
    name: howgo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOWGO_PUBLIC_URL
        value: https://howgo.laswi.com.cn
      - key: HOWGO_ADMIN_KEY
        generateValue: true
      # 固定管理员密码：容器无持久盘，不固定则重启后无法复现
      - key: HOWGO_ADMIN_PASSWORD
        generateValue: true
      # 云端数据（Supabase 项目 URL 形如 https://xxxx.supabase.co，以及 service_role key）
      - key: HOWGO_STORE_URL
        sync: false
      - key: HOWGO_STORE_KEY
        sync: false
      - key: LASWI_CLIENT_ID
        sync: false
      - key: LASWI_CLIENT_SECRET
        sync: false
      - key: LASWI_AUTH_BASE
        value: https://rtuser.rtstudio.top
